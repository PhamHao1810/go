# Load balancer trước các instance API.
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 16384; # mỗi worker giữ được 16k kết nối → đủ cho 50k user giữ keep-alive
    multi_accept on;
}

http {
    access_log /var/log/nginx/access.log combined buffer=64k flush=5s;
    keepalive_timeout 65s;
    keepalive_requests 10000;
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    # DNS nội bộ của Docker: phát hiện instance API mới khi scale/restart mà không cần reload Nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream api {
        zone api 64k;
        least_conn;                     # gửi request vào instance đang ít việc nhất
        server api:8080 resolve max_fails=3 fail_timeout=10s;
        keepalive 256;                  # tái sử dụng kết nối tới API, không bắt tay TCP mỗi request
    }

    # Rate limit theo IP để 1 client không làm nghẽn cả hệ thống. Bỏ qua IP nội bộ
    # (k6 load test, container khác); key rỗng = không giới hạn.
    # ponytail: đứng sau cloud LB thì mọi IP đều là IP nội bộ → cần real_ip_header trước khi bật lại.
    geo $internal {
        default        0;
        10.0.0.0/8     1;
        172.16.0.0/12  1;
        192.168.0.0/16 1;
        127.0.0.1/32   1;
    }
    map $internal $limit_key {
        1 "";
        0 $binary_remote_addr;
    }
    limit_req_zone $limit_key zone=perip:20m rate=100r/s;

    server {
        listen 80;
        client_max_body_size 1m;

        location / {
            limit_req zone=perip burst=200 nodelay;
            limit_req_status 429;

            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 2s;
            proxy_read_timeout 15s;

            # Instance chết/quá tải → thử instance khác. Nginx mặc định KHÔNG retry POST/PUT/DELETE
            # (không có non_idempotent), nên không bao giờ trừ kho 2 lần vì retry.
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
        }
    }
}
