# Máy DB. Postgres: Patroni tự chọn primary (tự failover), không phụ thuộc ROLE.
# ROLE (deploy.ps1 đặt theo primary Postgres lúc deploy) chỉ quyết định kho ảnh: primary nhận ghi, standby chép liên tục
# từ primary; standby giữ backup hằng đêm. Redis chạy ở mọi máy DB (API dùng máy đầu còn sống, xem rediscache.Connect).
# Mọi cổng chỉ nghe trên IP WireGuard + localhost; firewall chặn Internet.
name: products

services:
  postgres: # Postgres do Patroni quản lý (pg-start.sh): tự failover giữa các máy DB
    build:
      context: .
      dockerfile_inline: |
        FROM postgres:17-alpine
        RUN apk add --no-cache python3 py3-pip py3-psycopg2 py3-yaml
        RUN pip install --no-cache-dir --break-system-packages "patroni[etcd3]==4.0.4"
    image: products-patroni:17-4.0.4 # đổi Dockerfile ở trên thì đổi tag này để update.sh build lại
    restart: unless-stopped
    network_mode: host
    shm_size: 256mb
    entrypoint: ["sh", "/pg-start.sh"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      SELF_IP: ${SELF_IP:?}
      ETCD_HOSTS: ${ETCD_HOSTS:?}
      # RAM: mặc định cho VPS 8GB (~1/4 và 3/4 RAM). Máy nhỏ hơn đặt PG_SHARED_BUFFERS, PG_EFFECTIVE_CACHE_SIZE trong .env.
      PG_SHARED_BUFFERS: ${PG_SHARED_BUFFERS:-}
      PG_EFFECTIVE_CACHE_SIZE: ${PG_EFFECTIVE_CACHE_SIZE:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./pg-start.sh:/pg-start.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app -d products"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 1h # standby lần đầu phải chép toàn bộ DB từ primary
      start_interval: 2s
    stop_grace_period: 60s

  redis: # cache + đếm đăng nhập sai: mất khi restart/failover cũng không sao
    image: redis:7-alpine
    restart: unless-stopped
    network_mode: host
    command: ["redis-server", "--bind", "${SELF_IP}", "127.0.0.1", "--requirepass", "${REDIS_PASSWORD:?}",
              "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]

  storage: # kho ảnh S3-compatible
    image: chrislusf/seaweedfs:4.53
    restart: unless-stopped
    network_mode: host
    command: ["server", "-ip=${SELF_IP}", "-dir=/data", "-s3", "-s3.port=9000", "-s3.config=/etc/seaweedfs/s3.json"]
    volumes:
      - ./s3.json:/etc/seaweedfs/s3.json:ro
      - s3data:/data

  storage-init: # primary: tạo bucket "media" nếu chưa có rồi thoát
    profiles: [primary]
    image: amazon/aws-cli:2.27.0
    network_mode: host
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:?}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:?}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["sh", "-c", "until aws --endpoint-url http://${SELF_IP}:9000 s3api head-bucket --bucket media 2>/dev/null || aws --endpoint-url http://${SELF_IP}:9000 s3api create-bucket --bucket media; do sleep 2; done"]
    depends_on: [storage]

  storage-sync: # standby: chép liên tục mọi thay đổi ảnh từ primary
    profiles: [standby]
    image: chrislusf/seaweedfs:4.53
    restart: unless-stopped
    network_mode: host
    entrypoint: ["weed", "filer.sync", "-a", "${PRIMARY_IP}:8888", "-b", "${SELF_IP}:8888", "-isActivePassive"]
    depends_on: [storage]

  meilisearch: # search engine, chỉ chạy trên máy SEARCH_SERVER (deploy.ps1 bật profile "search")
    profiles: [search]
    image: getmeili/meilisearch:v1.20.0
    restart: unless-stopped
    network_mode: host
    environment:
      MEILI_ENV: production # bắt buộc có master key, tắt giao diện web
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-}
      MEILI_HTTP_ADDR: ${SELF_IP}:7700 # chỉ nghe trên WireGuard
      MEILI_NO_ANALYTICS: "true"
      # Máy này còn chạy Postgres: index bằng 1 luồng, tối đa 1GiB RAM, để chừa CPU/RAM cho DB.
      MEILI_MAX_INDEXING_THREADS: "1"
      MEILI_MAX_INDEXING_MEMORY: 1GiB
    volumes:
      - meilidata:/meili_data
    ulimits: # load test 1.000 khách: hết file descriptor mặc định (1024) → lỗi 500 "No file descriptors available"
      nofile: { soft: 65535, hard: 65535 }
    deploy:
      resources:
        limits: { memory: 2G }
    stop_grace_period: 30s

volumes:
  pgdata:
  s3data:
  meilidata:
